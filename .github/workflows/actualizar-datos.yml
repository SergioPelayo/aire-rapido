# Aire Rápido · actualizar-datos.yml · v1.0.0
name: Actualizar datos calidad del aire

on:
  schedule:
    - cron: "25 * * * *"   # cada hora, minuto 25 (UTC)
  workflow_dispatch:
    inputs:
      desde:
        description: "Carga histórica desde (AAAA-MM-DD, vacío = hoy y ayer)"
        required: false
      hasta:
        description: "Hasta (AAAA-MM-DD, vacío = hoy)"
        required: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y procesar
        run: |
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python scripts/fetch_junta.py --desde "${{ github.event.inputs.desde }}" ${{ github.event.inputs.hasta && format('--hasta {0}', github.event.inputs.hasta) || '' }}
          else
            python scripts/fetch_junta.py
          fi

      - name: Guardar cambios
        run: |
          git config user.name "aire-rapido-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
